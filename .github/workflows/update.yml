name: Aktualizace tabulek Ceskeho hokeje

on:
  schedule:
    - cron: '23 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hokej-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Nastavit Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalace zavislosti
        run: python -m pip install -r requirements.txt
      - name: Nacist aktualni data
        run: python update.py
      - name: Ulozit data.json
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.json
          if ! git diff --cached --quiet; then
            git commit -m 'Automaticka aktualizace hokejovych tabulek'
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo 'Obsah data.json se nezmenil.'
          fi
